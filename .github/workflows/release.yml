name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after all gates pass (false creates a draft)'
        required: true
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Kimmahone/apple-edu-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:distribution
      - run: npm run build
      - run: npm run test:mcp
      - run: npm run release:check -- --require-native
      - run: npm run release:build
      - run: node scripts/release/test-package.mjs
      - name: Create verified release
        env:
          GH_TOKEN: ${{ github.token }}
          APPLEMCP_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          if [ "$APPLEMCP_PUBLISH" = 'true' ]; then
            node scripts/release/publish.mjs --publish
          else
            node scripts/release/publish.mjs
          fi
